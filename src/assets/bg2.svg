<svg
  viewBox="0 0 1440 800"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none"
>
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f2ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>

    <!-- Plane icon -->
    <symbol id="plane" viewBox="0 0 24 24">
      <path d="M2 16l20-8-20-8v6l14 2-14 2z"/>
    </symbol>

    <!-- Location pin -->
    <symbol id="pin" viewBox="0 0 24 24">
      <path d="M12 2C7.6 2 4 5.4 4 9.8c0 5.4 8 12.2 8 12.2s8-6.8 8-12.2C20 5.4 16.4 2 12 2z"/>
    </symbol>

    <!-- Compass -->
    <symbol id="compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/>
      <path d="M14 10l-4 8 8-4-4-4z"/>
    </symbol>

    <!-- Suitcase -->
    <symbol id="bag" viewBox="0 0 24 24">
      <rect x="5" y="7" width="14" height="13" rx="2"/>
      <rect x="9" y="3" width="6" height="4"/>
    </symbol>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- ICON COLOR -->
  <g fill="#3b82f6" opacity="0.18">

    <!-- Row 1 -->
    <use href="#plane" x="80"  y="60"  transform="rotate(-10 80 60) scale(1.2)"/>
    <use href="#pin"   x="260" y="100" scale="1.1"/>
    <use href="#compass" x="440" y="80" scale="1"/>
    <use href="#bag"   x="620" y="120" scale="1.2"/>
    <use href="#plane" x="820" y="90"  transform="rotate(15 820 90) scale(1)"/>
    <use href="#pin"   x="1040" y="70" scale="1"/>
    <use href="#compass" x="1200" y="130" scale="1.1"/>

    <!-- Row 2 -->
    <use href="#bag"   x="120" y="260" scale="1"/>
    <use href="#plane" x="300" y="240" transform="rotate(-20 300 240) scale(1.3)"/>
    <use href="#pin"   x="500" y="280" scale="1"/>
    <use href="#compass" x="700" y="260" scale="1.2"/>
    <use href="#bag"   x="920" y="300" scale="1.1"/>
    <use href="#plane" x="1120" y="250" scale="1"/>

    <!-- Row 3 -->
    <use href="#pin"   x="90"  y="460" scale="1.2"/>
    <use href="#compass" x="280" y="480" scale="1"/>
    <use href="#plane" x="460" y="450" transform="rotate(12 460 450) scale(1.1)"/>
    <use href="#bag"   x="650" y="500" scale="1"/>
    <use href="#pin"   x="860" y="470" scale="1"/>
    <use href="#compass" x="1080" y="520" scale="1.1"/>
    <use href="#plane" x="1250" y="480" scale="1"/>

  </g>
</svg>
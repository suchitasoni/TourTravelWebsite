<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <defs>
    <pattern id="travelPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#c3eaff" stroke-width="2" opacity="0.15">

        <!-- Plane -->
        <path d="M10 40 l60 -20 -60 -20 v15 l40 5 -40 5z"/>

        <!-- Location Pin -->
        <path d="M120 30 c-10 0-18 8-18 18 0 14 18 32 18 32s18-18 18-32c0-10-8-18-18-18z"/>

        <!-- Suitcase -->
        <rect x="20" y="90" width="30" height="24" rx="3"/>
        <rect x="28" y="84" width="14" height="6"/>

        <!-- Compass -->
        <circle cx="110" cy="110" r="12"/>
        <path d="M110 98 l4 8 -8 4 4 -12z"/>

        <!-- Camera -->
        <rect x="60" y="60" width="28" height="18" rx="3"/>
        <circle cx="74" cy="69" r="4"/>

        <!-- Map -->
        <path d="M90 10 l10 5 10 -5 v25 l-10 5 -10 -5z"/>

      </g>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#travelPattern)"/>
</svg>
